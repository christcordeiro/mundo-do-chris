<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mundo do Chris</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff}#site-original{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<iframe id="site-original" src="site-original.html" title="Mundo do Chris"></iframe>
<script>
(function(){
  var frame=document.getElementById('site-original');
  frame.addEventListener('load',function(){
    try{
      var d=frame.contentDocument;
      if(!d||d.getElementById('catalog-enhancements-loader'))return;
      var s=d.createElement('script');
      s.id='catalog-enhancements-loader';
      s.src='catalog-enhancements.js?v=2';
      (d.body||d.documentElement).appendChild(s);
      try{document.title=d.title||document.title;}catch(e){}
    }catch(e){console.error('Não foi possível carregar as melhorias do catálogo.',e);}
  });
})();
</script>
</body>
</html>
